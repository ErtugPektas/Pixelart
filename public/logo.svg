<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%">
  <!-- Signature PixelArt Vector Logo -->
  <g transform="translate(10, 10)">
    <!-- Icon Mark -->
    <rect x="0" y="10" width="100" height="100" rx="24" fill="#090d16" stroke="#1e293b" stroke-width="3"/>
    <rect x="18" y="28" width="26" height="26" rx="5" fill="#ffffff"/>
    <rect x="48" y="28" width="26" height="26" rx="5" fill="#ffffff"/>
    <rect x="18" y="58" width="26" height="26" rx="5" fill="#ffffff"/>
    <rect x="18" y="88" width="26" height="26" rx="5" fill="#ffffff"/>
    <rect x="78" y="28" width="22" height="22" rx="4" fill="#65D22A"/>
    <rect x="48" y="58" width="26" height="26" rx="5" fill="#65D22A"/>
    <rect x="78" y="88" width="22" height="22" rx="4" fill="#65D22A"/>

    <!-- Logo Text: pixelart -->
    <!-- 'p' -->
    <text x="130" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-3">p</text>
    
    <!-- 'i' with Green Pixel Dot (#65D22A) -->
    <rect x="177" y="22" width="16" height="16" rx="3" fill="#65D22A"/>
    <text x="175" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#ffffff">ı</text>

    <!-- 'xel' -->
    <text x="198" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-3">xel</text>

    <!-- 'art' in Lime Green -->
    <text x="320" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#65D22A" letter-spacing="-3">art</text>
  </g>
</svg>
